<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modal com Steps</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/inputs.css">
  <link rel="icon" href="data:,">
</head>
<body>

<button id="openModalForm">Abrir Formulário</button>
<button id="openModalExplicacao">Explicação Regex</button>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close-btn" id="closeModalBtn">&times;</span>

    <!--Informacoes pessoais-->
    <div class="step" id="step1">
      <h2>Informações pessoais</h2>
      
      <div class="field">
        <input id="nome" type="text" placeholder=" " required>
        <label for="nome">Nome</label>
      </div>
      <div class="field">
        <input id="documento" type="text" placeholder=" " required>
        <label for="documento">CPF</label>
      </div>
      <div class="field">
        <input id="dtnascimento" type="text" placeholder=" " required>
        <label for="dtnascimento">Data de nascimento</label>
      </div>

      <div class="modal-buttons">
        <div class="modal-buttons-regress"></div>
        <div class="modal-buttons-progress">
          <button class="next-btn">Próximo</button>
        </div>
      </div>
    </div>

    <!--Informacoes de contato-->
    <div class="step" id="step2">
      <h2>Informações de contato</h2>
      
      <div class="field">
        <input id="telefone" type="text" placeholder=" " required>
        <label for="telefone">Telefone</label>
      </div>
      <div class="field">
        <input id="email" type="text" placeholder=" " required>
        <label for="email">E-mail</label>
      </div>
      
      <div class="modal-buttons">
        <div class="modal-buttons-regress">
          <button class="prev-btn">Voltar</button>
        </div>
        <div class="modal-buttons-progress">
          <button class="next-btn">Próximo</button>
        </div>
      </div>
    </div>

    <!--Informacoes de endereco-->
    <div class="step" id="step3">
      <h2>Informações de endereço</h2>
      
      <div class="field">
        <input id="cep" type="text" placeholder=" " required>
        <label for="cep">CEP</label>
      </div>
      <div class="field">
        <input id="logradouro" type="text" placeholder=" " required>
        <label for="logradouro">Logradouro</label>
      </div>
      <div class="field">
        <input id="numero" type="text" placeholder=" " required>
        <label for="numero">Número</label>
      </div>
      <div class="field">
        <input id="complemento" type="text" placeholder=" " required>
        <label for="complemento">Complemento</label>
      </div>
      <div class="field">
        <input id="cidade" type="text" placeholder=" " required>
        <label for="cidade">Cidade</label>
      </div>
      <div class="field">
        <input id="estado" type="text" placeholder=" " required>
        <label for="estado">Estado</label>
      </div>

      <div class="modal-buttons">
        <div class="modal-buttons-regress">
          <button class="prev-btn">Voltar</button>
        </div>
        <div class="modal-buttons-progress">
          <button class="finish-btn">Concluir</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="./js/modalFormulario.js"></script>
</body>
</html>
