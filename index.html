<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modal com Steps</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
</head>
<body>

<button id="openModalForm">Abrir Formulário</button>
<button id="openModalExplicacao">Explicação Regex</button>

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close-btn" id="closeModalBtn">&times;</span>

    <div class="step" id="step1">
      <h2>Etapa 1</h2>
      <p>Conteúdo da etapa 1.</p>
      <div class="modal-buttons">
        <div class="modal-buttons-regress"></div>
        <div class="modal-buttons-progress">
          <button class="next-btn">Próximo</button>
        </div>
      </div>
    </div>

    <div class="step" id="step2">
      <h2>Etapa 2</h2>
      <p>Conteúdo da etapa 2.</p>
      <div class="modal-buttons">
        <div class="modal-buttons-regress">
          <button class="prev-btn">Voltar</button>
        </div>
        <div class="modal-buttons-progress">
          <button class="next-btn">Próximo</button>
        </div>
      </div>
    </div>

    <div class="step" id="step3">
      <h2>Etapa 3</h2>
      <p>Conteúdo da etapa 3.</p>
      <div class="modal-buttons">
        <div class="modal-buttons-regress">
          <button class="prev-btn">Voltar</button>
        </div>
        <div class="modal-buttons-progress">
          <button class="finish-btn">Concluir</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
